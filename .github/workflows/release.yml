# SPDX-License-Identifier: BUSL-1.1
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.3.0)'
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  build-web:
    name: Build web (Netlify artifact)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with: { version: '9' }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @auditforge/web build
      - name: Package Netlify artifact
        run: |
          tar -czf web-netlify-${{ github.ref_name }}.tar.gz -C apps/web .next public netlify.toml || true
      - uses: actions/upload-artifact@v4
        with:
          name: web-netlify
          path: web-netlify-*.tar.gz
          retention-days: 90

  build-desktop:
    name: Build desktop (Tauri)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with: { version: '9' }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'pnpm' }
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @auditforge/desktop build
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/**/*
          retention-days: 90
          if-no-files-found: ignore

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with: { version: '9' }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - name: Install CycloneDX
        run: pnpm dlx @cyclonedx/cdxgen --version || true
      - name: Generate SBOM
        run: pnpm dlx @cyclonedx/cdxgen -o sbom.cdx.json -t pnpm . || true
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 365

  attest-receipts:
    name: Attach signed receipts
    runs-on: ubuntu-latest
    needs: [build-web, build-desktop, sbom]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - name: Generate signed receipt manifest
        run: |
          ls -lR dist
          echo "Release: ${{ github.ref_name }}" > receipt.txt
          echo "Commit:  ${{ github.sha }}" >> receipt.txt
          (cd dist && find . -type f -exec sha256sum {} \;) >> receipt.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-receipts
          path: receipt.txt
          retention-days: 365

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [build-web, build-desktop, sbom, attest-receipts]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/web-netlify/*
            dist/desktop-*/**/*
            dist/sbom/*
            dist/release-receipts/*
          fail_on_unmatched_files: false
