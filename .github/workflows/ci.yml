# SPDX-License-Identifier: BUSL-1.1
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '9' }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '9' }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '9' }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test -- --coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: setup
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: auditforge
          POSTGRES_PASSWORD: auditforge_test
          POSTGRES_DB: auditforge_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U auditforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '9' }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
        env:
          DATABASE_URL: postgres://auditforge:auditforge_test@localhost:5432/auditforge_test
      - run: pnpm test:integration
        env:
          DATABASE_URL: postgres://auditforge:auditforge_test@localhost:5432/auditforge_test
          REDIS_URL: redis://localhost:6379

  build:
    name: Build (web + api + desktop typecheck)
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '9' }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @auditforge/api build
        continue-on-error: true
      - run: pnpm --filter @auditforge/web build
        continue-on-error: true
      - run: pnpm --filter @auditforge/desktop typecheck
        continue-on-error: true

  e2e-playwright:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [setup, build]
    timeout-minutes: 30
    env:
      E2E_BASE_URL: http://localhost:3000
      E2E_API_URL: http://localhost:3001
      NEXT_PUBLIC_AUTH_STUB: '1'
      E2E_SKIP_GLOBAL_SETUP: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '9' }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-browsers-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pw-browsers-${{ runner.os }}-

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @auditforge/e2e exec playwright install --with-deps chromium firefox webkit

      - name: Boot web app (background)
        run: |
          pnpm --filter @auditforge/web dev > web.log 2>&1 &
          echo $! > web.pid
          for i in $(seq 1 60); do
            if curl -fs http://localhost:3000/ >/dev/null 2>&1; then echo "web ready"; break; fi
            sleep 2
          done

      - name: Run wave-3 smoke tests
        run: pnpm --filter @auditforge/e2e exec playwright test --grep @wave3 --project=chromium
        continue-on-error: true

      - name: Stop web app
        if: always()
        run: |
          if [ -f web.pid ]; then kill $(cat web.pid) || true; fi

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
          retention-days: 7

      - name: Upload web app log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-server-log
          path: web.log
          retention-days: 3

  semgrep-custom:
    name: Semgrep (custom rules)
    runs-on: ubuntu-latest
    needs: setup
    container:
      image: returntocorp/semgrep:latest
    steps:
      - uses: actions/checkout@v4
      - run: semgrep --config semgrep/ --severity ERROR --severity WARNING --error --json --output semgrep-custom.json . || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-custom-findings
          path: semgrep-custom.json
          retention-days: 14

  openapi-export:
    name: OpenAPI Spec Export
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '9' }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - name: Export OpenAPI
        run: |
          pnpm --filter @auditforge/api openapi:export 2>/dev/null || \
            echo "::warning::OpenAPI export script missing — add packages/api openapi:export"
        continue-on-error: true
      - name: Upload OpenAPI artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openapi-spec
          path: |
            apps/api/openapi.yaml
            apps/api/openapi.json
          if-no-files-found: ignore
          retention-days: 14
