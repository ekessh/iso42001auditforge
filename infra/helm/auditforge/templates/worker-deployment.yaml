{{- if .Values.worker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "auditforge.fullname" . }}-worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "auditforge.componentLabels" (dict "component" "worker" "Chart" .Chart "Release" .Release "Values" .Values) | nindent 4 }}
spec:
  {{- if not .Values.worker.autoscaling.enabled }}
  replicas: {{ .Values.worker.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "auditforge.componentSelector" (dict "component" "worker" "root" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "auditforge.componentSelector" (dict "component" "worker" "root" .) | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.worker.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "auditforge.serviceAccountName" . }}
      {{- include "auditforge.imagePullSecrets" . | nindent 6 }}
      automountServiceAccountToken: false
      securityContext:
        {{- include "auditforge.podSecurityContext" . | nindent 8 }}
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: {{ include "auditforge.image" (dict "root" . "image" .Values.worker.image) | quote }}
          imagePullPolicy: {{ include "auditforge.imagePullPolicy" (dict "root" . "image" .Values.worker.image) }}
          {{- with .Values.worker.command }}
          command: {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.worker.args }}
          args: {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: metrics
              containerPort: 9464
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "auditforge.fullname" . }}-config
            - secretRef:
                name: {{ include "auditforge.fullname" . }}-app-secrets
                optional: true
            {{- with .Values.worker.envFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            - name: AUDITFORGE_COMPONENT
              value: worker
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- with .Values.worker.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.worker.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.worker.readinessProbe | nindent 12 }}
          securityContext:
            {{- include "auditforge.containerSecurityContext" . | nindent 12 }}
          {{- with .Values.worker.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.worker.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
