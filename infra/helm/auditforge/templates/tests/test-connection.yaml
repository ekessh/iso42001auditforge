apiVersion: v1
kind: Pod
metadata:
  name: {{ include "auditforge.fullname" . }}-test-connection
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "auditforge.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: wget
      image: busybox:1.37
      command: ["sh", "-c"]
      args:
        - |
          set -e
          wget -qO- --tries=10 --timeout=5 \
            http://{{ include "auditforge.fullname" . }}-api:{{ .Values.api.service.port }}/healthz/live \
            && echo "API healthz OK" \
            || (echo "API healthz failed"; exit 1)
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
