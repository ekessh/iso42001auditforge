# SPDX-License-Identifier: BUSL-1.1
apiVersion: v2
name: auditforge
description: |
  AuditForge — ISO/IEC 42001 Lead Auditor Workbench.
  Highly available Kubernetes deployment of the API, worker, web UI, and supporting
  data services (PostgreSQL, Redis, MinIO/S3, Meilisearch, optional Ollama).
type: application
version: 0.14.0
appVersion: "0.14.0"
kubeVersion: ">=1.27.0-0"
home: https://github.com/auditforge/iso42001auditforge
sources:
  - https://github.com/auditforge/iso42001auditforge
maintainers:
  - name: AuditForge Maintainers
    email: maintainers@auditforge.example
icon: https://auditforge.example/logo.png
keywords:
  - iso42001
  - audit
  - aims
  - compliance
  - ai-governance
annotations:
  category: Compliance
  licenses: BUSL-1.1
  artifacthub.io/changes: |
    - kind: added
      description: Phase 14 hardening — HPA, NetworkPolicy, PDB, External Secrets, ServiceMonitor
    - kind: added
      description: BackupCronJob for pg_basebackup; archive renewal CronJob
    - kind: added
      description: Air-gapped values example with image registry override
    - kind: added
      description: Sub-charts for mcp-server, audit-evidence-runner, transcription-py, vlm-py
    - kind: added
      description: Optional Bitnami dependencies for postgresql / redis / minio
  artifacthub.io/recommendations: |
    - url: https://artifacthub.io/packages/helm/external-secrets-operator/external-secrets
    - url: https://artifacthub.io/packages/helm/cert-manager/cert-manager

dependencies:
  - name: mcp-server
    version: 0.14.0
    repository: ""
    condition: mcp-server.enabled
  - name: audit-evidence-runner
    version: 0.14.0
    repository: ""
    condition: audit-evidence-runner.enabled
  - name: transcription-py
    version: 0.14.0
    repository: ""
    condition: transcription-py.enabled
  - name: vlm-py
    version: 0.14.0
    repository: ""
    condition: vlm-py.enabled
  - name: postgresql
    version: 15.5.20
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: redis
    version: 20.1.7
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
  - name: minio
    version: 14.7.13
    repository: https://charts.bitnami.com/bitnami
    condition: minio.enabled
