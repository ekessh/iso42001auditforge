{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "audit-evidence-runner.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "audit-evidence-runner.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "audit-evidence-runner.selectorLabels" . | nindent 4 }}
{{- end }}
