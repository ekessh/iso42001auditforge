# SPDX-License-Identifier: BUSL-1.1
enabled: true

image:
  repository: ghcr.io/auditforge/audit-evidence-runner
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 2
containerPort: 8088

service:
  type: ClusterIP
  port: 80
  annotations: {}

ingress:
  enabled: false

env: []
envFrom: []

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 4000m
    memory: 8Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 85
  customMetrics:
    - type: External
      external:
        metric:
          name: probe_queue_depth
        target:
          type: AverageValue
          averageValue: "5"

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true
  allowedIngressNamespaces: []

serviceMonitor:
  enabled: true
  interval: 30s
  scrapeTimeout: 10s
  additionalLabels:
    release: kube-prometheus-stack

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 30

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 30

startupProbe:
  httpGet:
    path: /healthz
    port: http
  failureThreshold: 30
  periodSeconds: 10
  timeoutSeconds: 30

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  privileged: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
  runAsNonRoot: true
  runAsUser: 10001

# Probe sandbox volume sized large for ephemeral probe artifacts.
sandboxVolumeSizeLimit: 10Gi

# RuntimeClass — set to "gvisor" / "kata-clh" in prod values for stronger isolation.
runtimeClassName: ""

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
