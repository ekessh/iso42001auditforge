# SPDX-License-Identifier: BUSL-1.1
enabled: true

image:
  repository: ghcr.io/auditforge/transcription-py
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 1
containerPort: 8090

service:
  type: ClusterIP
  port: 80
  annotations: {}

ingress:
  enabled: false

env: []
envFrom: []

resources:
  requests:
    cpu: 1000m
    memory: 4Gi
    nvidia.com/gpu: 0
  limits:
    cpu: 4000m
    memory: 16Gi
    nvidia.com/gpu: 1

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 85
  customMetrics:
    - type: External
      external:
        metric:
          name: transcription_queue_depth
        target:
          type: AverageValue
          averageValue: "3"

podDisruptionBudget:
  enabled: true
  minAvailable: 0

networkPolicy:
  enabled: true
  allowedIngressNamespaces: []

serviceMonitor:
  enabled: true
  interval: 30s
  scrapeTimeout: 10s
  additionalLabels:
    release: kube-prometheus-stack

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 60
  periodSeconds: 30
  timeoutSeconds: 30

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 30

startupProbe:
  httpGet:
    path: /healthz
    port: http
  failureThreshold: 60
  periodSeconds: 10
  timeoutSeconds: 30

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  privileged: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
  runAsNonRoot: true
  runAsUser: 10001

modelCache:
  enabled: true
  size: 25Gi
  storageClass: ""

sandboxVolumeSizeLimit: 5Gi

runtimeClassName: ""

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
