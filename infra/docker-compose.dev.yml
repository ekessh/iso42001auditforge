# Dev stack for AuditForge ISO 42001 — single-machine developer experience.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: auditforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: auditforge
      POSTGRES_PASSWORD: auditforge_dev_only
      POSTGRES_DB: auditforge
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U auditforge -d auditforge']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: auditforge-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: auditforge-minio
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: auditforge_dev
      MINIO_ROOT_PASSWORD: auditforge_dev_only
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.10
    container_name: auditforge-meilisearch
    restart: unless-stopped
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: auditforge_dev_only_master_key
    ports:
      - '7700:7700'
    volumes:
      - meilisearch-data:/meili_data
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:7700/health']
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: auditforge-ollama
    restart: unless-stopped
    ports:
      - '11434:11434'
    volumes:
      - ollama-data:/root/.ollama

  mailhog:
    image: mailhog/mailhog:latest
    container_name: auditforge-mailhog
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'

  clamav:
    image: clamav/clamav:stable
    container_name: auditforge-clamav
    restart: unless-stopped
    ports:
      - '3310:3310'
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ['CMD', 'clamdcheck.sh']
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 240s

  audit-evidence-runner:
    build:
      context: ../services/audit-evidence-runner
      dockerfile: Dockerfile
    container_name: auditforge-audit-evidence-runner
    restart: unless-stopped
    ports:
      - '8088:8088'
    environment:
      AUDIT_RUNNER_HOST: '0.0.0.0'
      AUDIT_RUNNER_PORT: '8088'
      AUDIT_RUNNER_EGRESS_PROXY: ${AUDIT_RUNNER_EGRESS_PROXY:-}
      AUDIT_RUNNER_ALLOWED_HOSTS: ${AUDIT_RUNNER_ALLOWED_HOSTS:-}
      AUDIT_RUNNER_FS_ROOT: '/tmp/auditforge-checks'
      AUDIT_RUNNER_ENGAGEMENT_JWT_SECRET: ${AUDIT_RUNNER_ENGAGEMENT_JWT_SECRET:-auditforge_dev_only_engagement_secret}
      AUDIT_RUNNER_ENGAGEMENT_JWT_ALGORITHM: 'HS256'
      AUDIT_RUNNER_ENGAGEMENT_JWT_AUDIENCE: 'auditforge-audit-evidence-runner'
      AUDIT_RUNNER_ENGAGEMENT_JWT_ISSUER: 'auditforge-api'
      AUDIT_RUNNER_ENGAGEMENT_JWT_REQUIRED: 'true'
      AUDIT_RUNNER_SIGNING_ENDPOINT: ${AUDIT_RUNNER_SIGNING_ENDPOINT:-}
      AUDIT_RUNNER_SIGNING_SIGNER_ID: 'audit-evidence-runner'
      AUDIT_RUNNER_MAX_CONCURRENT_RUNS: '8'
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8088/healthz', timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data:
  minio-data:
  meilisearch-data:
  ollama-data:
  clamav-data:
