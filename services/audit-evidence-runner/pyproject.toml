# SPDX-License-Identifier: BUSL-1.1
[project]
name = "auditforge-audit-evidence-runner"
version = "0.1.0"
description = "AuditForge ISO 42001 — Python sidecar that runs catalogued, declarative ISO 42001 / NIST AI RMF audit-evidence checks against AI systems within a signed engagement scope."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "BUSL-1.1" }
authors = [{ name = "AuditForge", email = "ekesshtks@gmail.com" }]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.2",
    "anyio>=4.6.0",
    "sse-starlette>=2.1.3",
    "pyjwt[crypto]>=2.9.0",
    "cryptography>=43.0.0",
    "jsonschema>=4.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.9",
    "respx>=0.21.1",
    "asgi-lifespan>=2.1.0",
    "httpx>=0.27.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.9",
    "respx>=0.21.1",
    "asgi-lifespan>=2.1.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "RUF", "ASYNC"]
ignore = [
    "S101",
    "S104",
    "B008",
    "N818",   # Exception class naming: BudgetExceeded / EgressDenied / CheckNotFound are clearer than *Error suffix
    "RUF012", # Catalogue-class metadata uses lists/dicts as static class attrs by design
    "ASYNC109", # Test helper signature carries a timeout parameter intentionally
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "N802", "N803"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra -q --cov=services.audit_evidence_runner --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["services/audit_evidence_runner"]
omit = ["tests/*", "**/__init__.py"]
