# SPDX-License-Identifier: BUSL-1.1
[project]
name = "auditforge-vlm-py"
version = "0.1.0"
description = "AuditForge ISO 42001 — Python sidecar for VLM evidence extraction (Qwen2.5-VL / DeepSeek-OCR). Phase 7.6 scaffold."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "BUSL-1.1" }
authors = [{ name = "AuditForge", email = "ekesshtks@gmail.com" }]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
]

[project.optional-dependencies]
qwen = [
    "transformers>=4.45.0",
    "accelerate>=0.34.0",
    "torch>=2.4.0",
    "Pillow>=10.4.0",
]
deepseek = [
    "Pillow>=10.4.0",
]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.9",
    "httpx>=0.27.2",
    "asgi-lifespan>=2.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "RUF", "ASYNC"]
ignore = ["S101", "S104", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "N802"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra -q --cov=services.vlm_py --cov-report=term-missing"

[tool.coverage.run]
source = ["services/vlm_py"]
omit = ["tests/*", "**/__init__.py"]
