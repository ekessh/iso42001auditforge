[build]
  base = "apps/web"
  command = "cd ../.. && pnpm install --frozen-lockfile=false && pnpm --filter @auditforge/web... run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  PNPM_VERSION = "9.15.9"
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"
